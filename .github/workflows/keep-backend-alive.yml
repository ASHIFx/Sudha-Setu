name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BACKEND_URL: https://sudha-setu.onrender.com
    steps:
      - name: Ping backend health endpoint
        run: curl --fail --silent --show-error --max-time 30 "$BACKEND_URL/api/health"
